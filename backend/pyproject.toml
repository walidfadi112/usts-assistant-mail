[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "usts-mail-assistant"
version = "0.1.0"
description = "Backend IA pour un assistant de messagerie"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "httpx>=0.27",
    "pwdlib[argon2]>=0.2",
    "PyJWT>=2.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["tests", "tests.*", "alembic", "alembic.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]