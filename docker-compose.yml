services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=usts
      - N8N_BASIC_AUTH_PASSWORD=usts2026
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
